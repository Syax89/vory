name: Core regression verification (fork only)
on:
  push:
    branches: [ci/iphone-regression-check]
# Fork-only push job: no secrets or event text enters shell commands.
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [base, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use pinned upstream production for regression-red
        if: matrix.revision == 'base'
        run: git restore --source=e1bc576b5692144b64b9740777151287da9d104c -- Packages/VoryCore/Sources/VoryCore/Runtime/ChatRegistry.swift Packages/VoryCore/Sources/VoryCore/Runtime/GatewayRuntime.swift
      - name: Prepare existing tests against complete production core
        run: |
          swift --version
          python3 ci/prepare-core-tests.py
      - name: Run regressions
        env:
          REVISION: ${{ matrix.revision }}
        run: python3 ci/run-core-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-${{ matrix.revision }}
          path: |
            core-tests.log
            core-results.json
